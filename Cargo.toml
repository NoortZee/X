[package]
name = "kot-tas"
version = "0.2.0"
edition = "2021"
description = "King of Thieves TAS + rival stones scanner (Rust + Frida + Phantom)"

[[bin]]
name = "kot-tas"
path = "TAS/main.rs"

[dependencies]
ctrlc = "3.4"
frida = { path = "third_party/frida-rust/frida", features = ["auto-download"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
thiserror = "2.0"
ureq = "2.12"
