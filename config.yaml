phantom:
  host: "127.0.0.1"
  port: 27183
  connect_timeout_ms: 2000
  ping_timeout_ms: 1000
  sync_mode: "async"
  tap_down_to_up_ms: 1
  post_tap_wait_ms: 0
  slot: 0
  reconnect_attempts: 1

tap:
  position: "explicit"
  x: 540
  y: 960

stones:
  skip_on_no_match:
    x: 1775
    y: 970

  # Первый тап в серии — пауза после rival_update (дать UI отрисоваться).
  skip_wait_ms: 80

  # Темп тапов в серии: если игра не ответила тапом — тапаем снова
  # через этот интервал. Меньше = быстрее, но риск «двойного»
  # перелистывания, если латентность игры > burst_interval_ms.
  # 100–150 = агрессивно; 200–250 = безопасно.
  burst_interval_ms: 120

  # Если за это время не пришло ни одного rival_update — стоп + warning.
  stall_timeout_ms: 5000

orchestrator:
  nominal_fps: 60
  predict_lead_ms: 0
  predict_margin_ms: 0
  poll_interval_ms: 3
  post_tap_check_ms: 30
  retry_on_miss: true
  retry_delay_ms: 50
  fire_hard_deadline_s: 15
  wall_timeout_s: 300
  verify_body_frames: false

frida:
  device: "127.0.0.1:41337"
  package: "com.zeptolab.thieves.google"

logging:
  level: "INFO"
  log_dir: "logs"
