phantom:
  host: "127.0.0.1"
  port: 27183
  connect_timeout_ms: 2000
  ping_timeout_ms: 1000
  sync_mode: "async"
  tap_down_to_up_ms: 1
  post_tap_wait_ms: 0
  slot: 0
  reconnect_attempts: 1

tap:
  position: "explicit"
  x: 540
  y: 960

stones:
  skip_on_no_match:
    x: 1775
    y: 970

  skip_wait_ms: 80
  burst_interval_ms: 120
  stall_timeout_ms: 5000

  # --- стабильность для долгих сессий ---
  # Каждые N тапов — пауза, чтобы Waydroid/Android InputDispatcher успел
  # разгрести очередь. 0 = отключить (не рекомендуется).
  burst_pause_every: 500
  burst_pause_ms: 1500

  # Если подряд столько тапов вернули FAILED — abort LIVE
  # (phantom-server сдох / игра не отвечает).
  tap_fail_abort: 10

  # Периодическая проверка Frida-сессии (сек). 0 = отключить.
  health_check_interval_s: 3

  # true = полный дамп (все камни + каждый тап в лог).
  # false = компакт (детали только для MATCH, тап раз в 10).
  verbose_output: true

orchestrator:
  nominal_fps: 60
  predict_lead_ms: 0
  predict_margin_ms: 0
  poll_interval_ms: 3
  post_tap_check_ms: 30
  retry_on_miss: true
  retry_delay_ms: 50
  fire_hard_deadline_s: 15
  wall_timeout_s: 300
  verify_body_frames: false

frida:
  device: "127.0.0.1:41337"
  package: "com.zeptolab.thieves.google"

logging:
  level: "INFO"
  log_dir: "logs"
