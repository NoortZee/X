# ============================================================================
# King of Thieves TAS — конфиг
# ----------------------------------------------------------------------------
# Скопируй этот файл в config.yaml и заполни свои значения:
#     cp config.example.yaml config.yaml
#
# ⚠ config.yaml держи локально (в .gitignore) — там bot_token и chat_id.
# ⚠ bot_token никому не показывай. Если засветился — отзови:
#       @BotFather → /mybots → бот → API Token → Revoke current token
# ============================================================================

phantom:
  # TCP-адрес phantom-server (adb forward tcp:27183 tcp:27183)
  host: "127.0.0.1"
  port: 27183
  connect_timeout_ms: 2000
  ping_timeout_ms: 1000
  # "async" — не ждём ответа от Android (правильно для frozen-уровня).
  # "wait_for_finish" — зависает на frozen → не использовать.
  sync_mode: "async"
  tap_down_to_up_ms: 1
  post_tap_wait_ms: 0
  slot: 0
  reconnect_attempts: 1

# Размер окна Waydroid. Не задан — определяется автоматически: start/start.sh
# читает `adb shell wm size` и передаёт результат через KOT_TAS_SCREEN_WIDTH/HEIGHT.
# Переопредели вручную (width/height в пикселях) только если запускаешь
# target/release/kot-tas напрямую, без start.sh.
screen:

tap:
  # "fraction"           — доли окна (x_frac/y_frac), масштабируются под любое разрешение.
  # "center_lower_third" — x=w/2, y=h*2/3.
  # "explicit"           — абсолютные пиксели (x/y), без масштабирования.
  position: "fraction"
  # Точка тапа: левее центра по X, нижняя часть экрана по Y.
  x_frac: 0.28125
  y_frac: 0.916

stones:
  # Чем запрашивать следующего соперника:
  #   tap   — тап по кнопке next через phantom (по умолчанию): экран обновляется,
  #           потому что запрос отправляет сам клиент со своим обработчиком.
  #           Тап теперь событийный: только после прихода новых данных соперника.
  #   agent — игровой вызов Request_MatchMaking(flag=1) через frida: быстрее и
  #           детерминированнее (не зависит от координат кнопки и готовности UI),
  #           но экран НЕ обновляется: клиент обновит его при повторном входе в
  #           базу. Передать панели её обработчик нельзя — она пересоздаёт его,
  #           повторное использование валит клиент (проверено).
  skip_via: tap
  # agent-режим: на MATCH обновить экран — окно принудительного flag=0 плюс один
  # тап next. Клиент сам запросит ТЕКУЩЕГО соперника (flag=0 ничего не листает),
  # поэтому найденный соперник не теряется.
  sync_ui_on_match: true
  sync_window_ms: 3000

  # После MATCH модуль сам завершается и возвращает в меню. Задержка нужна,
  # чтобы клиент успел получить ответ и обновить экран (окно flag=0 ещё активно).
  exit_after_match: true
  exit_delay_ms: 2500

  # Координаты тапа next — нужны только при skip_via: tap.
  # Доли окна — кнопка остаётся на месте при любом разрешении.
  # Абсолютные x/y имеют приоритет, если задать и их тоже.
  skip_on_no_match:
    x_frac: 0.9245
    y_frac: 0.9256

  # Скип событийный, БЕЗ таймеров: тап отправляется сразу, как пришли новые
  # данные соперника (rival_update), то есть когда экран уже загружен.
  # Один экран = один тап; если соперник не пришёл, тап не повторяется.

  # Останавливать тапы, если игра начала заход в базу (Request_StartAttack) —
  # значит тап улетел мимо кнопки next.
  abort_on_attack: true

  # Watchdog: если новых данных соперника нет дольше stall_timeout_ms —
  # предупреждение и стоп (тапы не повторяются, ждём данные).
  stall_timeout_ms: 5000

  # Abort LIVE после N подряд FAILED-тапов (phantom/game сдохли).
  tap_fail_abort: 10

  # Периодическая health-check Frida-сессии, сек. 0 = выключить.
  health_check_interval_s: 3

  # true — полный дамп (каждый rival и каждый тап в лог).
  # false — компакт (детали только для MATCH, тап раз в 10).
  verbose_output: true

telegram:
  # false — уведомления не отправляются.
  enabled: true

  # Токен от @BotFather. Формат: "<bot_id>:<rest>".
  # ⚠ НЕ коммить в git, НЕ показывай в чатах. При компрометации — revoke.
  bot_token: "123456789:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"

  # chat_id получателя:
  #   * личный чат: https://api.telegram.org/bot<TOKEN>/getUpdates
  #     после /start боту → "chat": {"id": 123456789}
  #   * группа: "chat": {"id": -1001234567890} — бот должен быть в группе
  #   ⚠ НЕ -<bot_id> и НЕ <bot_id>! Это частая ошибка → HTTP 400 chat not found.
  chat_id: "123456789"

  # HTTP timeout для запроса к api.telegram.org, сек.
  timeout_s: 5

  # Антиспам: не отправлять чаще, чем раз в N сек.
  # 0 = без throttle (каждый MATCH даёт сообщение).
  min_interval_s: 10

orchestrator:
  # Номинальный FPS для расчёта таймингов.
  nominal_fps: 60

  # Упреждение тапа в мс. 0 — работает лучше (async-режим).
  predict_lead_ms: 0
  predict_margin_ms: 0

  # Интервал опроса play_state(), мс.
  poll_interval_ms: 3

  # Пауза после tap перед проверкой jump-count, мс.
  post_tap_check_ms: 30

  # Повторный тап, если не пришёл jumpFn.
  retry_on_miss: true
  retry_delay_ms: 50

  # Жёсткий дедлайн на один tap, сек.
  fire_hard_deadline_s: 15

  # Общий wall-timeout на прогон play, сек.
  wall_timeout_s: 300

  # Сверять body-состояние при play (тяжело, обычно false).
  verify_body_frames: false

frida:
  # adb forward tcp:41337 localabstract:/data/local/tmp/sysmon.sock
  device: "127.0.0.1:41337"
  package: "com.zeptolab.thieves.google"

replays:
  # Каталог реплеев: папка на базу (replays/<seed>/), внутри — md + png на прогон.
  dir: "replays"
  # Сколько последних прогонов хранить на одну базу (0 — не удалять ничего).
  keep_per_base: 10
  # Чем открывать PNG реплея (номер варианта в предложении или "png 1").
  viewer: "xdg-open"
  # Скриншот базы в шапку реплея: снимается в момент первого апдейта персонажа.
  # Только чтение: `adb exec-out screencap -p`, в игру ничего не пишется.
  screenshot:
    enabled: true
    # Серийник adb (как в `adb devices`); пусто — единственное устройство.
    adb_device: ""
    timeout_ms: 5000

# ----------------------------------------------------------------------------
# base — сохранение базы (серверная логика): сдвиг ловушки, которую двигают в
# редакторе. Значения ниже применяются при загрузке модуля `base`; дальше их
# можно менять командами меню (base cells 2 right / base px -32 0 / base off).
# ----------------------------------------------------------------------------
base:
  enabled: false       # подменять сразу после загрузки модуля
  cells: 1             # сдвиг в клетках (0 — не двигать); клетка = 64 px
  dir: "left"          # left | right | up | down
  cell_px: 64          # размер клетки арены в пикселях
  # pixels: [-32, 0]   # альтернатива клеткам: точный сдвиг в пикселях
